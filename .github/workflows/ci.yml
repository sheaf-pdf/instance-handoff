name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Each step runs a recipe from the justfile, so `just ci` locally checks the
# same things.
jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu, x86_64-apple-darwin, x86_64-unknown-freebsd, x86_64-unknown-netbsd, x86_64-unknown-illumos, aarch64-linux-android, wasm32-unknown-unknown, wasm32-wasip1
      - uses: extractions/setup-just@v4
      # tests/process.rs runs a launch under fakeroot, and tests/namespaces.rs
      # runs launches in user namespaces under bubblewrap. They skip without
      # them, except here.
      - name: Install fakeroot and bubblewrap
        run: sudo apt-get update && sudo apt-get install -y fakeroot bubblewrap
      # Ubuntu's AppArmor can keep programs, bwrap among them, from making
      # user namespaces.
      - name: Allow user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check formatting
        run: just fmt
      - name: Clippy
        run: just clippy
      # tests/process.rs also runs a launch from a copy of itself made
      # setgid to another of the runner's groups, which needs no root. It
      # skips where it can't, except here and on macOS.
      - name: Test (including doctests and cross-process tests)
        run: just test
        env:
          INSTANCE_HANDOFF_REQUIRE_FAKEROOT: "1"
          INSTANCE_HANDOFF_REQUIRE_BWRAP: "1"
          INSTANCE_HANDOFF_REQUIRE_SETGID: "1"
      - name: Build documentation
        run: just doc
      - name: Lint the Windows code
        run: just windows
      # The other Unixes the crate supports, and targets where it compiles
      # but can't own (Reason::Unsupported).
      - name: Lint other platforms
        run: just targets

  # Each platform has its own code: the runtime folder, the peer checks,
  # and on Windows the named-pipe transport, its access checks and the
  # foreground handoff.
  platforms:
    name: Checks on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: extractions/setup-just@v4
      - name: Clippy
        run: just clippy
      - name: Test
        run: just test
        # For tests/process.rs's setgid launch on macOS; Windows has none.
        env:
          INSTANCE_HANDOFF_REQUIRE_SETGID: "1"
      # The runner is an administrator with UAC off, so the step above runs
      # at high integrity. This one covers an ordinary, unelevated launch.
      - name: Test at medium integrity
        if: matrix.os == 'windows-latest'
        run: just test-medium
      - name: Probe what each integrity level may do with the other's files
        if: matrix.os == 'windows-latest'
        run: just levels

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep in step with rust-version in Cargo.toml, which `just msrv` reads.
      - uses: dtolnay/rust-toolchain@1.85
      - uses: extractions/setup-just@v4
      - name: Test
        run: just msrv
